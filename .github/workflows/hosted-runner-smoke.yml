name: Hosted Runner Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/crm-full-legacy-parity
    paths:
      - .github/workflows/hosted-runner-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner works
        run: |
          echo "GitHub-hosted runner is available"
          node --version
          echo "SMOKE_TEST=PASS"
