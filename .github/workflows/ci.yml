name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs need only the merge commit and its parents.
          # Main keeps a wider fail-closed history window without fetching all history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 50 }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Change safety (pull request)
        if: github.event_name == 'pull_request'
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUIRE_CHANGE_SCOPE: 'true'
        run: pnpm change-safety:check

      - name: Change safety (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHANGE_BASE_SHA: ${{ github.event.before }}
          REQUIRE_CHANGE_SCOPE: 'true'
        run: pnpm change-safety:check

      - name: Engineering integrity
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm engineering-integrity:check

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Affected workspace typecheck (draft PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: pnpm --filter "...[${{ github.event.pull_request.base.sha }}]" run typecheck

      - name: Full typecheck (ready PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: pnpm typecheck

      - name: Affected workspace typecheck (main smoke)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter "...[${{ github.event.before }}]" run typecheck

      - name: Lint (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Affected workspace tests (draft PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: pnpm --filter "...[${{ github.event.pull_request.base.sha }}]" run test

      - name: Full test suite (ready PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: pnpm test

      - name: Diagnose SP-03 AppModule bootstrap
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
        working-directory: apps/api
        env:
          NODE_ENV: test
        run: |
          set +e
          node --import ./scripts/typescript-test-runtime.mjs --input-type=module > "$GITHUB_WORKSPACE/sp03-bootstrap-diagnostic.log" 2>&1 <<'NODE'
          import { NestFactory } from '@nestjs/core';
          import { AppModule } from './src/app.module.js';

          try {
            const app = await NestFactory.createApplicationContext(AppModule, {
              logger: false,
              abortOnError: false,
            });
            await app.close();
            console.error('SP-03 diagnostic: AppModule bootstrap unexpectedly succeeded');
          } catch (error) {
            console.error('SP-03 diagnostic bootstrap error:', error);
            console.error('SP-03 diagnostic bootstrap stack:', error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          }
          NODE
          status=$?
          cat "$GITHUB_WORKSPACE/sp03-bootstrap-diagnostic.log"
          exit $status

      - name: Upload SP-03 bootstrap diagnostic
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/upload-artifact@v4
        with:
          name: sp03-bootstrap-diagnostic
          path: sp03-bootstrap-diagnostic.log
          if-no-files-found: error
          retention-days: 1

      - name: Affected workspace tests (main smoke)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter "...[${{ github.event.before }}]" run test

      - name: Build
        run: pnpm build

      - name: Main post-merge smoke complete
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Main governance, affected typecheck/tests, architecture checks, and build passed."
